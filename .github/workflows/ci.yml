name: Production CI/CD & Reliability Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gate:
    name: Frontend Quality & Deterministic Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Production Standalone Build
        run: npm run build

  backend-gate:
    name: Backend Security Matrix & Invariant Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Locked Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Security & RBAC Test Matrix
        run: python tests/run_tests.py

      - name: Run Calendar Engine & FSM Invalidation Tests
        run: python test_calendar_engine.py

      - name: Run Full Testing Strategy & Idempotency Suite
        run: python test_full_testing_strategy.py

  container-build-smoke:
    name: Container Artifact Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend-gate, backend-gate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: marketing-os-api:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: marketing-os-frontend:${{ github.sha }}
