version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketing_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing_os}
      POSTGRES_USER: ${POSTGRES_USER:-marketing_os_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing_os_dev_password_change_in_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing_os_app} -d ${POSTGRES_DB:-marketing_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - marketing_os_net

  redis:
    image: redis:7-alpine
    container_name: marketing_os_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - marketing_os_net

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing_os_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing_os_app}:${POSTGRES_PASSWORD:-marketing_os_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-marketing_os}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-super_secret_marketing_os_token_encryption_key_32bytes!}
      JWT_SECRET: ${JWT_SECRET:-marketing_os_jwt_session_signing_secret_key_2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - marketing_os_net

  worker-publishing:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing_os_publishing_worker
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.services.calendar.scheduler_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing_os_app}:${POSTGRES_PASSWORD:-marketing_os_dev_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-marketing_os}
      REDIS_URL: redis://redis:6379/0
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-super_secret_marketing_os_token_encryption_key_32bytes!}
      JWT_SECRET: ${JWT_SECRET:-marketing_os_jwt_session_signing_secret_key_2026}
    networks:
      - marketing_os_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketing_os_frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend-api:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - marketing_os_net

volumes:
  postgres_data:
  redis_data:

networks:
  marketing_os_net:
    driver: bridge
